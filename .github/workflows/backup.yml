name: Резервная копия D1

# Еженедельная выгрузка рабочей базы в закрытый бакет R2 (раздел 12.4).
# Копии старше 8 недель удаляет правило жизненного цикла бакета (см. docs/DEPLOY.md, шаг «Резервные копии»).
on:
  schedule:
    - cron: '17 2 * * 0' # воскресенье, 02:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save wrangler@4
      - name: Выгрузка базы
        run: npx wrangler d1 export catalog-prod --remote --output backup.sql
      - name: Сжатие и загрузка в R2
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          gzip -9 backup.sql
          npx wrangler r2 object put "bmarket-backups/d1/catalog-prod-${STAMP}.sql.gz" --file backup.sql.gz --content-type application/gzip --remote
