name: Резервная копия D1

# Еженедельная выгрузка рабочей базы (раздел 12.4). R2 в аккаунте не включён, поэтому копия
# хранится как артефакт GitHub Actions в этом приватном репозитории; срок хранения — 8 недель.
on:
  schedule:
    - cron: '17 2 * * 0' # воскресенье, 02:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-save wrangler@4
      - name: Выгрузка базы
        run: |
          npx wrangler d1 export catalog-prod --remote --output backup.sql
          gzip -9 backup.sql
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: catalog-prod-${{ env.STAMP }}
          path: backup.sql.gz
          retention-days: 56
