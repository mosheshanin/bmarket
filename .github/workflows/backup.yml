name: Резервная копия базы

# Еженедельная выгрузка рабочей базы Supabase (раздел 12.4). Копия хранится как артефакт
# GitHub Actions в этом приватном репозитории; срок хранения — 8 недель.
# Нужен секрет репозитория SUPABASE_DB_URL — строка подключения Session pooler (порт 5432)
# из Supabase → Connect. Фото в Supabase Storage сюда не входят.
on:
  schedule:
    - cron: '17 2 * * 0' # воскресенье, 02:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04
    # Секреты заведены в окружении GitHub «SUPABASE_DB_URL» (Settings → Environments).
    environment: SUPABASE_DB_URL
    steps:
      - name: Выгрузка базы
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Секрет SUPABASE_DB_URL не задан"; exit 1; fi
          SUPABASE_DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '[:space:]'); export SUPABASE_DB_URL
          # pg_dump той же версии, что сервер (Postgres 17).
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges' > backup.sql
          test -s backup.sql
          gzip -9 backup.sql
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: bmarket-db-${{ env.STAMP }}
          path: backup.sql.gz
          retention-days: 56
