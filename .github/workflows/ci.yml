name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Astro требует Node.js ≥ 22.23.4 — берём 24 (LTS).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Типы
        run: npx astro check
      - name: Юнит-тесты (initData, скрытые поля, форматы)
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Размер Worker < 3 МБ
        run: npm run size
      - name: E2E на локальном Worker
        run: |
          cp .dev.vars.example .dev.vars
          npm run db:migrate:local
          npm run db:seed:local
          bash scripts/seed-photos.sh --local
          npx astro preview --port 8787 --host 127.0.0.1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          npm run test:e2e
